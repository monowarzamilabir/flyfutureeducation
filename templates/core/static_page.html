{% extends "base.html" %}
{% block content %}
{% include "partials/page_header.html" with title=page.title %}

<section class="py-16 lg:py-24">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="prose max-w-none prose-headings:text-brand-navy prose-a:text-brand-blue">{{ page.body|safe }}</div>
    <p class="text-xs text-slate-400 mt-10">Last updated: {{ page.updated_at|date:"d M Y" }}</p>
  </div>
</section>
{% endblock %}
