{% load core_extras %}
<a href="{{ post.get_absolute_url }}" class="card group overflow-hidden flex flex-col hover:border-brand-navy/30 hover:shadow-card transition duration-200">
  <div class="h-40 bg-brand-navy overflow-hidden">
    {% if post.cover_image %}
      <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="h-full w-full object-cover group-hover:scale-105 transition duration-300">
    {% else %}
      <div class="h-full w-full flex items-center justify-center text-white/70">{% icon "book-open" "w-10 h-10" %}</div>
    {% endif %}
  </div>
  <div class="p-5 flex flex-col flex-1">
    {% if post.category %}<span class="font-mono text-[11px] text-brand-teal mb-2">{{ post.category.name }}</span>{% endif %}
    <h3 class="font-display font-semibold text-brand-navy mb-2 line-clamp-2">{{ post.title }}</h3>
    <p class="text-sm text-slate-500 flex-1 line-clamp-3">{{ post.excerpt|default:post.body|striptags|truncatewords:20 }}</p>
    <p class="text-xs text-slate-400 mt-4 pt-4 border-t border-dashed border-slate-200">{{ post.published_at|date:"d M Y" }}</p>
  </div>
</a>
