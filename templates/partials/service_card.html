{% load core_extras %}
<a href="{{ service.get_absolute_url }}" class="svc-card group" data-cursor="View" data-drift>
  <div class="svc-media" aria-hidden="true">
    {% if service.image %}<img src="{{ service.image.url }}" alt="" loading="lazy" decoding="async" class="photo-drift">{% endif %}
    <div class="svc-shade"></div>
  </div>
  <div class="svc-body">
    <div class="svc-icon">{% icon service.icon|default:"document" "w-5 h-5" %}</div>
    <h3 class="svc-title font-display font-semibold text-lg mt-5 mb-2">{{ service.title }}</h3>
    <p class="svc-desc text-sm leading-relaxed flex-1">{{ service.short_description }}</p>
    <span class="svc-link mt-5 inline-flex items-center gap-1.5 text-sm font-semibold">Learn more {% icon "arrow-right" "w-4 h-4" %}</span>
  </div>
</a>
