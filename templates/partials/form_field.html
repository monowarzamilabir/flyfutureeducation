{# Usage: {% include "partials/form_field.html" with field=form.name %} #}
<div class="mb-5">
  {% if field.label %}<label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<p class="text-xs text-slate-400 mt-1">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-xs text-red-600 mt-1 font-semibold">{{ error }}</p>{% endfor %}
</div>
